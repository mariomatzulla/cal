<f:layout name="Default" />
<f:section name="Header"></f:section>
<f:section name="content">
  <f:if condition="{view} == 'list'">
    <f:render partial="List/List" arguments="{_all}" />
  </f:if>
  <f:if condition="{view} == 'year'">
    <f:render partial="Year/Year" arguments="{_all}" />
  </f:if>
  <f:if condition="{view} == 'month'">
    <f:render partial="Month/Month" arguments="{_all}" />
  </f:if>
  <f:if condition="{view} == 'week'">
    <f:render partial="Week/Week" arguments="{_all}" />
  </f:if>
  <f:if condition="{view} == 'day'">
    <f:render partial="Day/Day" arguments="{_all}" />
  </f:if>
</f:section>
