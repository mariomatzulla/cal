<f:layout name="Default" />
<f:section name="Header"></f:section>
<f:section name="content">
  <div class="location">
    <main class="place-card">
      <article class="record-card{f:if(condition: location.image, else: ' record-card--no-image')}">
        <div class="record-card__head">
          <f:render partial="Record/Images" arguments="{images: location.image, group: 'cal-location-{location.uid}', config: settings.view.location.image, settings: settings}" />
          <div class="record-card__body">
            <h1>{location.name}</h1>
            <f:if condition="{location.description}">
              <div class="description"><f:format.html>{location.description}</f:format.html></div>
            </f:if>
            <f:render partial="Record/Details" arguments="{record: location, view: 'location'}" />
            <f:render partial="Record/Thumbnails" arguments="{images: location.image, group: 'cal-location-{location.uid}', config: settings.view.location.image, settings: settings}" />
          </div>
        </div>
      </article>
    </main>
    <div id="calendar-event-backlink">
      <f:cObject typoscriptObjectPath="plugin.tx_cal.settings.view.backLink">
        <f:translate key="l_back" />
      </f:cObject>
    </div>
  </div>
</f:section>
