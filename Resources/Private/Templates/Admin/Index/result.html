<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Backend" />
<f:section name="content">
  <h1>
    <f:translate key="backend_module_indexer_header" />
  </h1>
  <f:flashMessages />
  <p>
    <f:translate key="backend_module_indexer_range" arguments="{0: starttime, 1: endtime}" />
  </p>
  <f:for each="{results}" as="result">
    <div class="card mb-3">
      <div class="card-header">
        <strong>{result.title}</strong> [{result.pid}]
      </div>
      <div class="card-body">
        <p>
          <f:translate key="backend_module_indexer_pageResult" arguments="{0: result.count}" />
        </p>
        <f:if condition="{result.events}">
          <f:then>
            <ul>
              <f:for each="{result.events}" as="title">
                <li>{title}</li>
              </f:for>
            </ul>
          </f:then>
          <f:else>
            <p><f:translate key="backend_module_indexer_nothingToDo" /></p>
          </f:else>
        </f:if>
      </div>
    </div>
  </f:for>
  <f:link.action action="index" class="btn btn-default">
    <f:translate key="backend_module_indexer_function1" />
  </f:link.action>
  <f:link.action action="generate" class="btn btn-primary">
    <f:translate key="backend_module_indexer_function2" />
  </f:link.action>
</f:section>
</html>
