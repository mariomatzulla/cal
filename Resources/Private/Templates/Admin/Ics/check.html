<f:layout name="Backend" />
<f:section name="content">
  <h1>
    <f:translate key="backend_module_ics_generator_header" />
  </h1>
  <f:flashMessages />
  <h3>
    <f:translate key="backend_module_ics_generator_function3" />
  </h3>
  <f:if condition="{result}">
    <f:then>
    <p>
      <f:for each="{result}" as="row">
      [UID: {row.event.uid}; PID: {row.event.pid}] {row.event.title} &rarr;
      <f:if condition="{row.reason}">
        <f:then><f:translate key="backend_module_ics_generator_reason_{row.reason}" /></f:then>
        <f:else><f:translate key="backend_module_ics_generator_reason_none" /></f:else>
      </f:if><br />
      </f:for>
      </p>
    </f:then>
    <f:else>
    <p><f:translate key="backend_module_ics_generator_no_problems" /></p>
    </f:else>
  </f:if>
  <f:link.action action="index" class="btn btn-primary">
    <f:translate key="backend_module_ics_generator_function1" />
  </f:link.action>
  <f:link.action action="generate" class="btn btn-primary">
    <f:translate key="backend_module_ics_generator_function2" />
  </f:link.action>
</f:section>
</html>
