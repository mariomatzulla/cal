<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--cal:description--><f:transform.html>{event.description -> f:format.raw()}</f:transform.html>
<!--cal:attachments-->
<f:for each="{event.attachment}" as="attachment">{f:uri.typolink(parameter: 'file:{attachment.originalResource.originalFile.uid}', absolute: 1)}
</f:for><!--cal:images-->
<f:for each="{event.image}" as="image">{f:uri.typolink(parameter: 'file:{image.originalResource.originalFile.uid}', absolute: 1)}
</f:for></html>
