<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:mmcal="http://typo3.org/ns/MarioMatzulla/Cal/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="titleId" value="cal-day-title-{contentUid}" />
<section class="cal-view cal-timegrid cal-timegrid--day" aria-labelledby="{titleId}">
  <f:render partial="Calendar/Header" arguments="{
    titleId: titleId,
    title: '{f:format.date(date: getdate, pattern: settings.view.day.displayDate.format, locale: settings.dateConfig.locale)}',
    activeView: 'day', calendarViews: calendarViews, getdate: getdate, settings: settings,
    navAction: settings.view.dayLinkTarget,
    prevArguments: {year: prevDay.year, month: prevDay.month, day: prevDay.day},
    todayArguments: {year: today.year, month: today.month, day: today.day},
    nextArguments: {year: nextDay.year, month: nextDay.month, day: nextDay.day},
    prevLabel: 'l_last_day', nextLabel: 'l_next_day'
  }" />
  <mmcal:week dateObject="{getdate}" events="{events}" view="day">
    <f:render partial="Day/TimeGrid" arguments="{_all}" />
  </mmcal:week>
</section>
</html>
