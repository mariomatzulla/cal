<div class="year-button">
  <f:link.action action="{settings.view.yearLinkTarget}" arguments="{year: getdate.year }" title="{f:translate(key:'l_year')}"><f:format.date pattern='Y' locale="{settings.dateConfig.locale}">{getdate}</f:format.date></f:link.action>
</div>
<div class="month-button">
  <f:link.action action="{settings.view.monthLinkTarget}" arguments="{year: getdate.year, month: getdate.month }" title="{f:translate(key:'l_month')}"><f:format.date pattern='MMM' locale="{settings.dateConfig.locale}">{getdate}</f:format.date></f:link.action>
</div>
<div class="week-button">
  <f:link.action action="{settings.view.weekLinkTarget}" arguments="{year: getdate.year, week: getdate.weekOfYear }" title="{f:translate(key:'l_week')}"><f:format.date pattern='w' locale="{settings.dateConfig.locale}">{getdate}</f:format.date>W</f:link.action>
</div>
<div class="day-button">
  <f:link.action action="{settings.view.dayLinkTarget}" arguments="{year: getdate.year, month: getdate.month, day: getdate.day }" title="{f:translate(key:'l_day')}"><f:format.date pattern='d' locale="{settings.dateConfig.locale}">{getdate}</f:format.date></f:link.action>
</div>
