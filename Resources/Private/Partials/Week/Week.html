<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:mmcal="http://typo3.org/ns/MarioMatzulla/Cal/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="titleId" value="cal-week-title-{contentUid}" />
<f:variable name="title"><f:format.date pattern="{settings.view.week.displayDate.startFormat}" locale="{settings.dateConfig.locale}">{starttime}</f:format.date> – <f:format.date pattern="{settings.view.week.displayDate.endFormat}" locale="{settings.dateConfig.locale}">{endtime}</f:format.date></f:variable>
<section class="cal-view cal-timegrid cal-timegrid--week" aria-labelledby="{titleId}">
  <f:render partial="Calendar/Header" arguments="{
    titleId: titleId, title: title,
    activeView: 'week', calendarViews: calendarViews, getdate: getdate, settings: settings,
    navAction: settings.view.weekLinkTarget,
    prevArguments: {year: prevWeek.year, week: prevWeek.weekOfYear},
    todayArguments: {year: today.year, week: today.weekOfYear},
    nextArguments: {year: nextWeek.year, week: nextWeek.weekOfYear},
    prevLabel: 'l_last_week', nextLabel: 'l_next_week'
  }" />
  <mmcal:week dateObject="{getdate}" events="{events}">
    <f:render partial="Week/TimeGrid" arguments="{_all}" />
  </mmcal:week>
</section>
</html>
