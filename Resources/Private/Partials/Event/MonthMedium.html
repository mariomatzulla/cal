<f:link.action action="event" arguments="{type: event.modelType, uid: event.uid, year: event.start.year, month: event.start.month, day: event.start.day  }">
<f:if condition="{event.allday}">
  <f:then>
  {event.title}
  </f:then>
  <f:else>
    <f:format.date pattern='{settings.view.event.event.timeFormat}' locale="{settings.dateConfig.locale}">{event.start}</f:format.date> {event.title}
  </f:else>
</f:if>
</f:link.action>
