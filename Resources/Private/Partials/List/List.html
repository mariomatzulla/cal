<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="list-view">
  <h1 class="list-view__title">
    <f:format.date pattern="{settings.view.list.heading.dateFormat}" locale="{settings.dateConfig.locale}">{starttime}</f:format.date>
    –
    <f:format.date pattern="{settings.view.list.heading.dateFormat}" locale="{settings.dateConfig.locale}">{endtime}</f:format.date>
  </h1>
  <f:if condition="{eventCount}">
    <f:then>
      <p class="found">{f:translate(key: 'LLL:EXT:cal/Resources/Private/Language/locallang.xlf:l_list_found', arguments: {0: eventCount})}</p>
      <div class="event-cards">
        <f:for each="{events}" as="event" iteration="iterator">
          <f:render partial="List/Event" arguments="{event: event, iterator: iterator, settings: settings, eventLink: eventLink, viewLinks: viewLinks}" />
        </f:for>
      </div>
    </f:then>
    <f:else>
      <p class="no-results"><f:translate key="LLL:EXT:cal/Resources/Private/Language/locallang.xlf:l_no_results" /></p>
    </f:else>
  </f:if>
</div>
</html>
