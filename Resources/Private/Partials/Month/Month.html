<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="titleId" value="cal-month-title-{contentUid}" />
<section class="cal-view cal-month" aria-labelledby="{titleId}">
  <f:render partial="Calendar/Header" arguments="{
    titleId: titleId,
    title: '{f:format.date(date: getdate, pattern: settings.view.month.displayDate, locale: settings.dateConfig.locale)}',
    activeView: 'month', calendarViews: calendarViews, getdate: getdate, settings: settings,
    navAction: settings.view.monthLinkTarget,
    prevArguments: {year: prevMonth.year, month: prevMonth.month},
    todayArguments: {year: today.year, month: today.month},
    nextArguments: {year: nextMonth.year, month: nextMonth.month},
    prevLabel: 'l_last_month', nextLabel: 'l_next_month'
  }" />
  <div class="cal-month__scroll" tabindex="0" role="region" aria-labelledby="{titleId}">
    <f:render partial="Month/Grid" arguments="{_all}" />
  </div>
</section>
</html>
