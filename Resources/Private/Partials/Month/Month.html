<div class="month-view">
  <div class="header-buttons" >
    <f:render partial="Header/Header" arguments="{_all}"/>
    <div class="today-button">
      <f:link.action action="{settings.view.monthLinkTarget}" arguments="{year: today.year, month: today.month }" title="{f:translate(key:'l_today')}"><f:translate key="l_today"/></f:link.action>
    </div>
  </div>
  <br style="clear: both;"/><br />
  <div class="view-header">
    <div class="previous-button">
      <f:link.action action="{settings.view.monthLinkTarget}" arguments="{year: prevMonth.year, month: prevMonth.month }" title="{f:translate(key:'l_last_month')}">&nbsp;</f:link.action>
    </div>
    <div class="next-button">
      <f:link.action action="{settings.view.monthLinkTarget}" arguments="{year: nextMonth.year, month: nextMonth.month }" title="{f:translate(key:'l_next_month')}">&nbsp;</f:link.action>
    </div>
    <h1><f:format.date pattern='{settings.view.month.displayDate}' locale="{settings.dateConfig.locale}">{getdate}</f:format.date></h1>
  
    <f:render partial="Month/Large" arguments="{settings:settings,events:events,rightsManager:rightsManager,getdate:getdate,monthOffset:0}"/>
  </div>

</div>
